<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>You're connected — Tillbird</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 48px 20px; background: #f6f3ec; color: #23281f;
      display: flex; min-height: 100vh; align-items: center; justify-content: center;
    }
    .wrap { max-width: 460px; text-align: center; }
    .dot {
      width: 48px; height: 48px; border-radius: 50%; background: #2f4d3a; color: #fffdf8;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 24px;
    }
    h1 { font-size: 22px; margin: 0 0 14px; }
    p { line-height: 1.6; color: #55594c; margin: 0 0 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dot">&#10003;</div>
    <h1>You're connected</h1>
    <p>Tillbird is now connected to {{ store_name }}.</p>
    <p>We're putting together your assistant from your store's own products and policies — we'll be in touch once it's reviewed and ready to add to your site.</p>
    <p>You can close this window.</p>
  </div>
</body>
</html>
